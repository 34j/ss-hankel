[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "ss-hankel"
version = "1.1.1"
description = """\
  Derivative-free method to find zeros of analytic functions / solve nonlinear eigenvalue problems using contour \
  integration\
  """
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "attrs>=25.3",
  "cyclopts>=3.24.0",
  "rich>=10",
  "scipy>=1.13.1",
  "sympy>=1.14",
  "typing-extensions>=4.13.2",
]
urls."Bug Tracker" = "https://github.com/34j/ss-hankel/issues"
urls.Changelog = "https://github.com/34j/ss-hankel/blob/main/CHANGELOG.md"
urls.documentation = "https://ss-hankel.readthedocs.io"
urls.repository = "https://github.com/34j/ss-hankel"
scripts.ss-hankel = "ss_hankel.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.extend-per-file-ignores."src/ss_hankel/_main.py" = [
  "C901",
  "DOC501",
  "N806",
  "NPY002",
  "PLR2004",
  "PLR6104",
  "RUF002",
  "TRY301",
]
lint.extend-per-file-ignores."src/ss_hankel/_score.py" = [ "A002", "ARG001", "DOC501" ]
lint.extend-per-file-ignores."src/ss_hankel/cli.py" = [ "A004" ]
lint.extend-per-file-ignores."src/ss_hankel/testing.py" = [ "D401" ]
lint.extend-per-file-ignores."tests/test_dunder_main.py" = [ "S404", "S603" ]
lint.extend-per-file-ignores."tests/test_main.py" = [ "RUF059" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
